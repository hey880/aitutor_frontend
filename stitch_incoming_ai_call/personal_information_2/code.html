<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Profile - AI English Tutor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b6cee",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
            min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen">
<div class="max-w-[480px] mx-auto min-h-screen bg-white dark:bg-background-dark flex flex-col shadow-xl">
<div class="px-4 pt-4 pb-2 border-b border-slate-100 dark:border-slate-800">
<div class="flex items-center justify-between mb-4">
<button class="p-2 -ml-2 text-slate-900 dark:text-white flex items-center gap-1">
<span class="material-symbols-outlined text-[20px]">arrow_back_ios</span>
<span class="font-normal">Settings</span>
</button>
<h1 class="text-lg font-semibold text-slate-900 dark:text-white">Edit Profile</h1>
<button class="text-primary font-bold text-base px-2">Save</button>
</div>
</div>
<div class="flex-1 overflow-y-auto px-4 py-8 flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-white text-sm font-semibold px-1">Display Name</label>
<input class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 h-14 px-4 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400" placeholder="What the AI calls you" type="text" value="Alex Smith"/>
<p class="text-xs text-slate-400 px-1">This is the name your AI tutor will use during conversations.</p>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-white text-sm font-semibold px-1">Self-Introduction</label>
<textarea class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 p-4 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400 min-h-[140px] resize-none" placeholder="Tell the AI about your interests, goals, or level...">I am an intermediate English learner looking to improve my business conversation skills. I love traveling and photography.</textarea>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-white text-sm font-semibold px-1">Date of Birth</label>
<div class="relative">
<input class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 h-14 px-4 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all appearance-none" type="date" value="1995-01-01"/>
<span class="material-symbols-outlined absolute right-4 top-4 text-slate-400 pointer-events-none">calendar_month</span>
</div>
</div>
<div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/30 flex gap-3 border border-slate-100 dark:border-slate-800">
<span class="material-symbols-outlined text-primary">privacy_tip</span>
<p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
                    Your introduction helps the AI tutor personalize lesson topics and vocabulary to your interests.
                </p>
</div>
</div>
<div class="p-8 flex flex-col items-center gap-2">
<p class="text-[10px] uppercase tracking-widest text-slate-400 font-medium">Unique Identifier</p>
<div class="bg-slate-100 dark:bg-slate-800/50 px-4 py-2 rounded-full border border-slate-200 dark:border-slate-700">
<p class="text-xs font-mono text-slate-600 dark:text-slate-400">SN-9823-4410-XF</p>
</div>
</div>
</div>

</body></html>
