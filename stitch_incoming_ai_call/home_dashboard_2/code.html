<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login to LingoDash</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b6cee",
                        "kakao": "#FEE500",
                        "kakao-text": "#191919",
                        "background-light": "#f8f9fa",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen">
<div class="max-w-md mx-auto min-h-screen flex flex-col shadow-2xl bg-white dark:bg-slate-900 overflow-hidden relative">
<header class="pt-16 pb-12 px-8 flex flex-col items-center">
<div class="text-primary flex size-14 items-center justify-center rounded-2xl bg-primary/10 mb-4">
<span class="material-symbols-outlined text-4xl">translate</span>
</div>
<h1 class="text-slate-900 dark:text-white text-2xl font-bold tracking-tight">LingoDash</h1>
</header>
<main class="flex-1 px-8 flex flex-col justify-center">
<div class="text-center mb-12">
<h2 class="text-3xl font-bold text-slate-900 dark:text-white leading-tight mb-3">
                    Master English with your AI Tutor
                </h2>
<p class="text-slate-500 dark:text-slate-400">
                    Join thousands of learners and start speaking fluently today.
                </p>
</div>
<div class="space-y-4">
<button class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 h-[56px] rounded-xl text-slate-700 dark:text-slate-200 font-semibold transition-all active:scale-[0.98] shadow-sm">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
<button class="w-full flex items-center justify-center gap-3 bg-kakao h-[56px] rounded-xl text-kakao-text font-semibold transition-all active:scale-[0.98] shadow-sm">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 3C6.477 3 2 6.48 2 10.78c0 2.76 1.843 5.19 4.623 6.51-.237.868-.857 3.138-.98 3.608-.15.58.21.57.44.414.18-.124 2.892-1.963 4.052-2.748.61.088 1.237.135 1.865.135 5.523 0 10-3.48 10-7.78C22 6.48 17.523 3 12 3z"></path>
</svg>
                    Continue with Kakao
                </button>
</div>
</main>
<footer class="pb-12 px-8">
<div class="flex flex-col items-center gap-2">
<p class="text-[11px] text-slate-400 dark:text-slate-500 text-center px-4">
                    By continuing, you agree to our terms and acknowledge you've read our policies.
                </p>
<div class="flex items-center gap-4">
<a class="text-[12px] font-medium text-slate-500 dark:text-slate-400 hover:text-primary transition-colors" href="#">Terms of Service</a>
<div class="size-1 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
<a class="text-[12px] font-medium text-slate-500 dark:text-slate-400 hover:text-primary transition-colors" href="#">Privacy Policy</a>
</div>
</div>
</footer>
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
</div>

</body></html>
