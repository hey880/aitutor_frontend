<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Select Proficiency Level</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b6cee",
                        "background-pure": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Lexend', sans-serif;
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-pure min-h-screen text-slate-900 font-display">
<div class="relative flex min-h-screen w-full flex-col max-w-[430px] mx-auto overflow-x-hidden bg-white">
<div class="flex items-center bg-white p-4 pb-2 justify-between">
<div class="text-slate-900 flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-slate-900 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Onboarding</h2>
</div>
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between items-end">
<p class="text-slate-900 text-base font-semibold leading-normal">Step 1: Proficiency</p>
<p class="text-slate-500 text-sm font-medium leading-normal">1 of 8</p>
</div>
<div class="rounded-full bg-slate-100 overflow-hidden border border-slate-200">
<div class="h-2 rounded-full bg-primary transition-all duration-300" style="width: 12.5%;"></div>
</div>
</div>
<div class="px-4 py-6">
<h2 class="text-slate-900 tracking-tight text-[28px] font-bold leading-tight text-center">
                What is your English level?
            </h2>
<p class="text-slate-600 text-center mt-2 text-sm">This helps us personalize your AI learning path.</p>
</div>
<div class="flex flex-col gap-4 p-4 flex-grow" style="--radio-dot-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(43,108,238)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3ccircle cx=%278%27 cy=%278%27 r=%274%27/%3e%3c/svg%3e');">
<label class="relative flex items-center gap-4 rounded-xl border border-solid border-slate-200 bg-white p-4 cursor-pointer transition-all hover:bg-slate-50 has-[:checked]:border-primary has-[:checked]:bg-blue-50/30">
<div class="flex size-10 shrink-0 items-center justify-center rounded-lg bg-slate-50 text-primary border border-slate-100">
<span class="material-symbols-outlined text-[24px]">child_care</span>
</div>
<div class="flex grow flex-col">
<p class="text-slate-900 text-base font-semibold leading-tight">Beginner</p>
<p class="text-slate-500 text-sm font-normal leading-normal mt-1">I'm just starting to learn</p>
</div>
<input class="h-6 w-6 border-2 border-slate-300 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0 checked:focus:border-primary appearance-none rounded-full" name="proficiency" type="radio"/>
</label>
<label class="relative flex items-center gap-4 rounded-xl border border-solid border-slate-200 bg-white p-4 cursor-pointer transition-all hover:bg-slate-50 has-[:checked]:border-primary has-[:checked]:bg-blue-50/30">
<div class="flex size-10 shrink-0 items-center justify-center rounded-lg bg-slate-50 text-primary border border-slate-100">
<span class="material-symbols-outlined text-[24px]">forum</span>
</div>
<div class="flex grow flex-col">
<p class="text-slate-900 text-base font-semibold leading-tight">Intermediate</p>
<p class="text-slate-500 text-sm font-normal leading-normal mt-1">I can have everyday conversations</p>
</div>
<input checked="" class="h-6 w-6 border-2 border-slate-300 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0 checked:focus:border-primary appearance-none rounded-full" name="proficiency" type="radio"/>
</label>
<label class="relative flex items-center gap-4 rounded-xl border border-solid border-slate-200 bg-white p-4 cursor-pointer transition-all hover:bg-slate-50 has-[:checked]:border-primary has-[:checked]:bg-blue-50/30">
<div class="flex size-10 shrink-0 items-center justify-center rounded-lg bg-slate-50 text-primary border border-slate-100">
<span class="material-symbols-outlined text-[24px]">school</span>
</div>
<div class="flex grow flex-col">
<p class="text-slate-900 text-base font-semibold leading-tight">Advanced</p>
<p class="text-slate-500 text-sm font-normal leading-normal mt-1">I can speak fluently on complex topics</p>
</div>
<input class="h-6 w-6 border-2 border-slate-300 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0 checked:focus:border-primary appearance-none rounded-full" name="proficiency" type="radio"/>
</label>
<label class="relative flex items-center gap-4 rounded-xl border border-solid border-slate-200 bg-white p-4 cursor-pointer transition-all hover:bg-slate-50 has-[:checked]:border-primary has-[:checked]:bg-blue-50/30">
<div class="flex size-10 shrink-0 items-center justify-center rounded-lg bg-slate-50 text-primary border border-slate-100">
<span class="material-symbols-outlined text-[24px]">psychology</span>
</div>
<div class="flex grow flex-col">
<p class="text-slate-900 text-base font-semibold leading-tight">Fluent</p>
<p class="text-slate-500 text-sm font-normal leading-normal mt-1">I use English like a native speaker</p>
</div>
<input class="h-6 w-6 border-2 border-slate-300 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0 checked:focus:border-primary appearance-none rounded-full" name="proficiency" type="radio"/>
</label>
</div>
<div class="flex flex-col px-4 pb-10 pt-3 gap-4 bg-white">
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-white text-lg font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/20 active:scale-95 transition-transform">
<span class="truncate">Next</span>
<span class="material-symbols-outlined ml-2 text-[20px]">arrow_forward</span>
</button>
<div class="h-1.5 w-32 bg-slate-200 rounded-full mx-auto mt-4"></div>
</div>
</div>

</body></html>
