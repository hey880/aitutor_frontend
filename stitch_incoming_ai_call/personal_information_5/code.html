<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Call Schedule</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b6cee",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Lexend', sans-serif;
            min-height: 100dvh;
        }.no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .time-picker-gradient {
            background: linear-gradient(to bottom, 
                rgba(255,255,255,1) 0%, 
                rgba(255,255,255,0) 20%, 
                rgba(255,255,255,0) 80%, 
                rgba(255,255,255,1) 100%);
        }
        .dark .time-picker-gradient {
            background: linear-gradient(to bottom, 
                rgba(16,22,34,1) 0%, 
                rgba(16,22,34,0) 20%, 
                rgba(16,22,34,0) 80%, 
                rgba(16,22,34,1) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark">
<div class="max-w-[480px] mx-auto min-h-screen bg-white dark:bg-background-dark flex flex-col shadow-xl">
<div class="px-4 pt-4 pb-2 border-b border-slate-100 dark:border-slate-800">
<div class="flex items-center justify-between">
<button class="p-2 -ml-2 text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h2 class="text-slate-900 dark:text-white font-semibold text-lg">Edit Call Schedule</h2>
<div class="w-10"></div>
</div>
</div>
<div class="flex-1 overflow-y-auto px-6 py-6 flex flex-col gap-8">
<div class="flex flex-col gap-4">
<div class="flex flex-col">
<h3 class="text-slate-900 dark:text-white text-lg font-bold">Select Days</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">When should your tutor call you?</p>
</div>
<div class="grid grid-cols-7 gap-2">
<button class="aspect-square flex flex-col items-center justify-center rounded-xl border-2 border-primary bg-primary text-white font-medium text-xs">
                        M
                    </button>
<button class="aspect-square flex flex-col items-center justify-center rounded-xl border-2 border-primary bg-primary text-white font-medium text-xs">
                        T
                    </button>
<button class="aspect-square flex flex-col items-center justify-center rounded-xl border-2 border-primary bg-primary text-white font-medium text-xs">
                        W
                    </button>
<button class="aspect-square flex flex-col items-center justify-center rounded-xl border-2 border-primary bg-primary text-white font-medium text-xs">
                        T
                    </button>
<button class="aspect-square flex flex-col items-center justify-center rounded-xl border-2 border-primary bg-primary text-white font-medium text-xs">
                        F
                    </button>
<button class="aspect-square flex flex-col items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 text-slate-600 dark:text-slate-400 text-xs">
                        S
                    </button>
<button class="aspect-square flex flex-col items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 text-slate-600 dark:text-slate-400 text-xs">
                        S
                    </button>
</div>
</div>
<div class="flex flex-col gap-4">
<div class="flex flex-col">
<h3 class="text-slate-900 dark:text-white text-lg font-bold">Preferred Time</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">Choose your ideal daily reminder time.</p>
</div>
<div class="relative bg-slate-50/50 dark:bg-slate-800/30 rounded-3xl p-6 overflow-hidden">
<div class="absolute inset-x-4 top-1/2 -translate-y-1/2 h-12 bg-white dark:bg-slate-700 rounded-xl shadow-sm pointer-events-none ring-1 ring-slate-200 dark:ring-slate-600"></div>
<div class="relative flex justify-center items-center h-48 gap-4 overflow-hidden">
<div class="w-16 h-full overflow-y-auto no-scrollbar text-center py-20 snap-y snap-mandatory">
<div class="h-12 flex items-center justify-center text-slate-300 dark:text-slate-600 snap-center text-xl">07</div>
<div class="h-12 flex items-center justify-center text-slate-300 dark:text-slate-600 snap-center text-xl">08</div>
<div class="h-12 flex items-center justify-center text-slate-900 dark:text-white snap-center text-2xl font-bold">09</div>
<div class="h-12 flex items-center justify-center text-slate-300 dark:text-slate-600 snap-center text-xl">10</div>
<div class="h-12 flex items-center justify-center text-slate-300 dark:text-slate-600 snap-center text-xl">11</div>
</div>
<div class="text-slate-900 dark:text-white font-bold text-2xl">:</div>
<div class="w-16 h-full overflow-y-auto no-scrollbar text-center py-20 snap-y snap-mandatory">
<div class="h-12 flex items-center justify-center text-slate-300 dark:text-slate-600 snap-center text-xl">15</div>
<div class="h-12 flex items-center justify-center text-slate-300 dark:text-slate-600 snap-center text-xl">20</div>
<div class="h-12 flex items-center justify-center text-slate-900 dark:text-white snap-center text-2xl font-bold">30</div>
<div class="h-12 flex items-center justify-center text-slate-300 dark:text-slate-600 snap-center text-xl">45</div>
<div class="h-12 flex items-center justify-center text-slate-300 dark:text-slate-600 snap-center text-xl">00</div>
</div>
<div class="ml-4 flex flex-col gap-1 p-1 bg-slate-200 dark:bg-slate-700 rounded-lg">
<button class="px-4 py-1.5 rounded-md text-xs font-bold transition-all bg-white dark:bg-slate-600 text-primary shadow-sm">AM</button>
<button class="px-4 py-1.5 rounded-md text-xs font-bold transition-all text-slate-500 dark:text-slate-400">PM</button>
</div>
</div>
<div class="absolute inset-0 pointer-events-none time-picker-gradient"></div>
</div>
</div>
<div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/30 flex gap-3 border border-slate-100 dark:border-slate-800 mt-auto">
<span class="material-symbols-outlined text-primary">notifications_active</span>
<p class="text-sm text-slate-500 dark:text-slate-400">
                    We'll send you a reminder 5 minutes before each scheduled session.
                </p>
</div>
</div>
<div class="p-4 bg-white dark:bg-background-dark border-t border-slate-100 dark:border-slate-800">
<button class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                Save Schedule
            </button>
</div>
</div>

</body></html>
