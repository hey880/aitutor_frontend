<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Incoming AI Call</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b6cee",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "call-green": "#22c55e",
                        "call-red": "#ef4444"
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-hidden max-w-md mx-auto">
<div class="flex items-center p-4 justify-between pt-12">
<div class="text-white/60 flex size-12 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-[24px]">expand_more</span>
</div>
<div class="flex flex-col items-center">
<span class="text-xs uppercase tracking-[0.2em] text-white/40 font-medium">AI Language Partner</span>
</div>
<div class="size-12"></div> 
</div>
<div class="flex flex-1 flex-col items-center justify-center -mt-10">
<div class="relative mb-10">
<div class="absolute inset-0 rounded-full bg-primary/10 blur-2xl scale-125"></div>
<div class="relative flex items-center justify-center h-48 w-48 rounded-full border border-white/10 bg-white/5 backdrop-blur-sm">
<span class="text-6xl font-light text-white tracking-tighter opacity-80">S</span>
<div class="absolute inset-2 rounded-full border border-white/5"></div>
</div>
</div>
<div class="flex flex-col items-center justify-center text-center px-6">
<h1 class="text-white text-5xl font-bold leading-tight tracking-tight mb-3">Sarah</h1>
<p class="text-primary text-lg font-medium tracking-wide mb-1">Scheduled Daily Practice</p>
<p class="text-white/40 text-base font-normal tracking-tight">Incoming AI Call...</p>
</div>
</div>
<div class="px-8 mb-12">
<div class="grid grid-cols-2 gap-8 max-w-xs mx-auto">
<div class="flex flex-col items-center gap-2 group cursor-pointer">
<div class="rounded-full bg-white/5 p-3 group-hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-white/80 text-[22px]">alarm</span>
</div>
<p class="text-white/50 text-[10px] font-bold uppercase tracking-widest">Remind Me</p>
</div>
<div class="flex flex-col items-center gap-2 group cursor-pointer">
<div class="rounded-full bg-white/5 p-3 group-hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-white/80 text-[22px]">chat_bubble</span>
</div>
<p class="text-white/50 text-[10px] font-bold uppercase tracking-widest">Message</p>
</div>
</div>
</div>
<div class="px-10 pb-16">
<div class="flex justify-between items-center max-w-sm mx-auto">
<div class="flex flex-col items-center gap-3">
<button class="flex size-20 cursor-pointer items-center justify-center rounded-full bg-call-red hover:bg-red-600 transition-all shadow-lg shadow-red-900/20 active:scale-95">
<span class="material-symbols-outlined text-white text-[40px] rotate-[135deg]">call</span>
</button>
<span class="text-white/60 text-sm font-medium">Decline</span>
</div>
<div class="flex flex-col items-center gap-3">
<button class="flex size-20 cursor-pointer items-center justify-center rounded-full bg-call-green hover:bg-green-600 transition-all shadow-lg shadow-green-900/20 active:scale-95">
<span class="material-symbols-outlined text-white text-[40px]">call</span>
</button>
<span class="text-white/60 text-sm font-medium">Accept</span>
</div>
</div>
</div>
<div class="flex justify-center pb-2 w-full">
<div class="h-1.5 w-36 bg-white/10 rounded-full"></div>
</div>
</div>

</body></html>
